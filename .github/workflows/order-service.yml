# CI pipeline for the Order service.
# Every pull request and every push to main passes the same gates, fastest first.
# The image is built ONCE, tagged with the commit SHA, tested, and that exact
# image is published: it is never rebuilt for a later environment.
# Third-party actions are pinned to full commit SHAs (supply-chain protection).
name: order-service

on:
  pull_request:
    paths:
      - "services/order/**"
      - "services/notification/test/contract/**"
      - "contracts/**"
      - "chassis/**"
      - "docker-compose.yml"
      - "scripts/smoke-test.sh"
      - ".github/workflows/order-service.yml"
  push:
    branches: [main]
    paths:
      - "services/order/**"
      - "services/notification/test/contract/**"
      - "contracts/**"
      - "chassis/**"
      - "docker-compose.yml"
      - "scripts/smoke-test.sh"
      - ".github/workflows/order-service.yml"
  workflow_dispatch:

# Least privilege by default; the publish job asks for more.
permissions:
  contents: read

concurrency:
  group: order-service-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  IMAGE: ghcr.io/${{ github.repository_owner }}/maltashop-order:${{ github.sha }}

jobs:
  verify:
    name: "1a · Lint, unit and contract tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            services/order/package-lock.json
            services/notification/package-lock.json
      - name: Shared chassis copies are in sync
        run: ./scripts/sync-chassis.sh --check
      - name: Install dependencies (exact versions from the lock files)
        run: |
          npm ci --prefix services/order
          npm ci --prefix services/notification
      - name: Lint
        run: npm run lint --prefix services/order
      - name: Unit tests
        run: npm run test:unit --prefix services/order
      - name: Contract tests (consumer expectations, then provider verification)
        run: |
          npm run test:contract --prefix services/notification
          npm run test:contract --prefix services/order
      - name: Dependency audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high --prefix services/order

  secret-scan:
    name: "1b · Secret scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  build:
    name: "2 · Build image once and scan it"
    needs: [verify, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image, tagged with the commit SHA
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --tag "$IMAGE" services/order
      - name: Vulnerability scan (fail on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Hand the tested image to the next stages
        run: docker save "$IMAGE" | gzip > order-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: order-image
          path: order-image.tar.gz
          retention-days: 1

  integration:
    name: "3 · Integration and smoke tests (docker compose)"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # docker compose runs the image under test instead of building Order again
      ORDER_IMAGE: ghcr.io/${{ github.repository_owner }}/maltashop-order:${{ github.sha }}
      ORDER_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: order-image
      - name: Load the image under test
        run: gunzip -c order-image.tar.gz | docker load
      - name: Start the whole system (real PostgreSQL and RabbitMQ)
        run: |
          docker compose build inventory-service payment-service notification-service
          docker compose up -d --no-build --wait --wait-timeout 180
      - name: Smoke tests (happy path, idempotency, compensation, out of stock, correlation)
        run: ./scripts/smoke-test.sh
      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: "4 · Publish the tested image (main only)"
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: order-image
      - name: Load the image that passed every gate
        run: gunzip -c order-image.tar.gz | docker load
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (no rebuild) and record the digest
        run: |
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "Published $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Next: CD bumps this digest in the GitOps repo; Argo CD deploys it to staging." >> "$GITHUB_STEP_SUMMARY"
